# solver configuration values
# ============================
#
# Every setting the solver reads, and where to change one. This file is the editable
# half; the types and the fallback defaults are declared in `config.py` beside it, so a
# line deleted here means "use the default", not "break the shell".
#
# Precedence:  environment  >  this file  >  the default in config.py
#
# Two environment variables outrank a line below: EULER_REPO_ROOT (which decides
# `root_dir`, and so most of [paths]) and EULER_BASE_URL (which decides `base_url`).
#
# Values may name other values, and these computed anchors, as ${name}:
#
#   ${root_dir}     the working tree              e.g. /home/you/euler
#   ${package_dir}  the installed solver package  e.g. /home/you/euler/solver
#   ${secrets_dir}  the machine-local secrets dir e.g. /home/you/.euler
#   ${home_dir}     your home directory
#
# Section headings are for reading only — the solver sees one flat namespace, so a key
# must appear under exactly one of them. `#` and `;` start a comment anywhere on a line.
#
# There is no command that edits this file, and none is wanted: read the settings with
# `{config}` in the shell (or `{config.timeout_single}` for one), change one by editing
# here. The single exception is `ecb_usd_rate`, which `update-usd-rate` refreshes from
# the European Central Bank's feed and writes back in place.


[limits]
# Seconds a solution may run. `timeout_single` covers one run; with --runs=N the harness
# is held to `timeout_multiple` per run, since N runs of a slow solution is not N times
# as interesting as one.
timeout_single    = 90.0
timeout_multiple  = 30.0
# Seconds to wait on a single Claude API call. Generating a C translation of a long
# solution genuinely takes minutes.
api_timeout       = 600.0
# Ceiling on one generated artifact.
max_output_tokens = 10000
# Attempts before an API call or a download gives up.
max_retries       = 3
# Keep in sync with tox.ini [flake8] max-line-length.
max_line_length   = 120


[names]
# What each file is called inside a problem's directory. Changing one of these renames
# nothing that already exists — the stack is on disk under the old name.
notes_filename      = notes.html
resource_dirname    = resources
results_filename    = results.json
statement_filename  = statement.html
tags_filename       = tags.json
test_cases_filename = test_cases.json


[urls]
# Where problem statements are scraped from.
projecteuler_url = https://projecteuler.net
# Where `show` and `edit` send a terminal browser. The deployed web tier sets
# EULER_BASE_URL instead, which wins.
base_url         = https://euler.vikasmunshi.com


[rates]
# Euros per US dollar, for what `costs` reports: the Claude API prices in dollars.
# Maintained by `update-usd-rate` from the ECB daily reference feed — the one value in
# this file that is refreshed rather than chosen. Hand-editing it is fine; the next
# refresh will overwrite it.
ecb_usd_rate = 1.1554


[paths]
# The stack, and everything read alongside it.
solutions_dir        = ${root_dir}/solutions
static_file_problems = ${root_dir}/solutions/problems.json
static_file_progress = ${root_dir}/solutions/.progress.html
topics_dir           = ${root_dir}/topics
central_tags_file    = ${root_dir}/topics/tags.json
topics_index_file    = ${root_dir}/topics/articles.json
docs_dir             = ${root_dir}/docs
# Working state, all inside the checkout and all ignored by git.
backup_dir           = ${root_dir}/.backup
cache_dir            = ${root_dir}/.cache
state_dir            = ${root_dir}/.state
# What ships in the wheel, so anchored to the package rather than the tree.
templates_dir        = ${package_dir}/templates
modules_file         = ${package_dir}/modules.csv
# The project dotenv — API key, SMTP and DNS credentials. Machine-local, in the sibling
# secrets dir *outside* the checkout, which is why it is anchored to ${secrets_dir}.
env_file             = ${secrets_dir}/env


[crypto]
# Key material, all of it in the machine-local secrets dir and none of it in the
# checkout — file permissions are the protection, so moving any of these somewhere
# world-readable is not a configuration change, it is a disclosure.
#
# Not listed here, and not settable: `share.json` (its location is *discovered* — the
# deployed /etc/euler if there is one, else ${secrets_dir}, unless EULER_SHARE_FILE
# says otherwise) and the wire-format constants, which are protocol rather than
# preference and live in solver/crypto/wire.py. Changing the vault's KDF iteration
# count would stop the browser deriving the same key, so it is not a knob either.
private_key_file    = ${secrets_dir}/id
enc_key_file        = ${secrets_dir}/enc-key.json
vault_file          = ${secrets_dir}/vault
# Rolling backups kept of the private key.
private_key_backups = 5


[scripts]
# The shell scripts the solver drives, relative to the working tree it runs from.
audit                   = ${root_dir}/scripts/git/audit.sh
compile_c               = ${root_dir}/scripts/c/compile.sh
configure_identity      = ${root_dir}/scripts/git/configure-identity.sh
install_chrome          = ${root_dir}/scripts/setup/chrome.sh
install_dev_env         = ${root_dir}/scripts/setup/dev_env.sh
install_upgrade_service = ${root_dir}/scripts/setup/upgrade_service.sh
linter                  = ${root_dir}/scripts/linters/check.sh
publish                 = ${root_dir}/scripts/git/publish.sh
status                  = ${root_dir}/scripts/git/status.sh
sync                    = ${root_dir}/scripts/git/sync.sh
upgrade                 = ${root_dir}/scripts/pip/upgrade.sh
